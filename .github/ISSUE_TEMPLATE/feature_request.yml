name: 💡 功能建议
description: 希望增加的能力或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。请尽量说明使用场景，而不只是“加个功能”。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      placeholder: 例如：公司代理需要认证，现在只能把用户名密码写进 URL……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
      placeholder: 支持 `--proxy-user` / 从环境变量读取代理认证……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 命令行
        - 图形界面
        - 下载引擎
        - 文档 / 打包
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
